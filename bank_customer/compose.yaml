services:
  postgres:
    image: 'postgres:18.4-alpine'
    restart: unless-stopped
    container_name: 'bank_service_postgres'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
# Interpolation of .env in compose.yaml -> https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/
    ports:
      - '${POSTGRES_PORT}:5432'

  redis:
    image: 'redis:8.0-alpine'
    restart: unless-stopped
    container_name: 'bank_service_redis'
    environment:
      - 'REDIS_PASSWORD=secret'
      - 'REDIS_HOST=redis'
      - 'REDIS_PORT=6379'
      - 'REDIS_DATABASE=bank_redis'
    ports:
      - '${REDIS_PORT}:6379'

# https://grafana.com/docs/opentelemetry/docker-lgtm/
# LGTM stack -
#  Loki (log aggregator),
#  Tempo (tracing),
#  Grafana (visualization), and
#  Mimir (long-term storage for Prometheus metrics)
  Grafana:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana dashboard
      - "4317:4317" # OpenTelemetry Collector over gRPC
      - "4318:4318" # OpenTelemetry Collector over HTTP
